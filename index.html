<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nóva IA — Enterprise Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050d08;
            --card-bg: #091a10;
            --accent-green: #00ff66;
            --accent-hover: #00cc52;
            --text-main: #ffffff;
            --text-muted: #8fa898;
            --input-bg: #0d2617;
            --border-color: #143d24;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-deep);
            background-image: radial-gradient(circle at 50% 20%, #0d2617 0%, var(--bg-deep) 70%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .login-card {
            background-color: var(--card-bg);
            padding: 45px;
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .brand-logo {
            font-size: 32px;
            font-weight: 700;
            color: var(--accent-green);
            letter-spacing: -0.5px;
            display: block;
            margin-bottom: 5px;
        }

        .brand-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            margin-bottom: 35px;
            display: block;
        }

        h2 {
            color: var(--text-main);
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: var(--text-main);
            font-size: 12px;
            margin-bottom: 6px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-green);
            box-shadow: 0 0 0 3px rgba(0, 255, 102, 0.15);
        }

        .btn-login {
            background-color: var(--accent-green);
            color: #000000;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-login:hover {
            background-color: var(--accent-hover);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .footer-corporate {
            margin-top: 35px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <span class="brand-logo">NÓVA IA</span>
            <span class="brand-subtitle">Enterprise Gateway</span>
            
            <h2>Acesse sua conta</h2>
            <p>Gerencie seu atendente automatizado</p>

            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>
            
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button class="btn-login" onclick="alert('Conectando...')">Entrar</button>

            <div class="footer-corporate">
                &copy; 2026 Nóva IA. Todos os direitos reservados.<br>
                Conexão segura via Supabase.
            </div>
        </div>
    </div>
</body>
</html>
