<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nóva IA — Enterprise Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- Estilos com o Verde da Marca --- */
        :root {
            --primary-color: #0b1f15;    /* Verde Escuro Profundo (Fundo do Card) */
            --accent-color: #00e676;     /* Verde Vibrante Sofisticado (Botão/Detalhes) */
            --bg-gradient: linear-gradient(135deg, #07170f 0%, #020805 100%); /* Fundo da Tela */
            --text-main: #ffffff;        /* Branco Principal */
            --text-muted: #a0b5a8;       /* Cinza esverdeado para subtítulos */
            --input-bg: #122b1f;         /* Verde escuro levemente mais claro para input */
            --border-color: #1b4d32;     /* Borda do input */
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Efeito de luz de fundo sutil */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0,230,118,0.1) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            top: 10%;
            left: 15%;
            z-index: 1;
        }

        .login-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .login-card {
            background-color: var(--primary-color);
            padding: 50px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            border: 1px solid rgba(0,230,118,0.1);
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .brand-header {
            margin-bottom: 40px;
        }

        .brand-logo {
            font-size: 36px;
            font-weight: 700;
            color: var(--accent-color);
            letter-spacing: -1px;
            display: block;
        }

        .brand-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        h2 {
            color: var(--text-main);
            margin-bottom: 10px;
            font-size: 24px;
            font-weight: 600;
        }

        p {
            color: var(--text-muted);
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: var(--text-main);
            font-size: 13px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 16px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            color: var(--text-main);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(0,230,118,0.2);
        }

        .btn-login {
            background-color: var(--accent-color);
            color: #051009; /* Texto escuro para contraste perfeito no botão verde */
            border: none;
            padding: 18px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-login:hover {
            background-color: #00c853; /* Verde um pouco mais escuro no hover */
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .footer-corporate {
            margin-top: 40px;
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 20px;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            margin: 0 10px;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: var(--accent-color);
        }

    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="brand-header">
                <span class="brand-logo">NÓVA IA</span>
                <span class="brand-subtitle">PLATAFORMA ENTERPRISE</span>
            </div>
            
            <h2>Autenticação Corporativa</h2>
            <p>Acesse o painel de controle do seu atendente inteligente.</p>

            <div class="input-group">
                <label for="email">E-mail Corporativo</label>
                <input type="email" id="email" placeholder="voce@suaempresa.com.br" required>
            </div>
            
            <div class="input-group">
                <label for="password">Chave de Acesso (Senha)</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button class="btn-login" onclick="alert('Conectando ao motor de IA...')">Entrar no Sistema</button>

            <div class="footer-corporate">
                &copy; 2026 Nóva IA Global Tech. Todos os direitos reservados.<br>
                Ambiente seguro e monitorado.
                <div class="footer-links" style="margin-top: 10px;">
                    <a href="#">Suporte</a> | <a href="#">Termos de Uso</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
